<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS3 Topic Options</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<button class="back-btn" onclick="goBack()">Back</button>

<div id="userWelcome" class="welcome-banner" style="text-align:center; width:100%;"></div>

<div class="language-selector" style="position:absolute; top:15px; right:110px;">
    <select id="languageSelect" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="ar">العربية</option>
    </select>
</div>

<button id="logoutBtn" class="logout-btn" style="top:15px; right:20px;">Logout</button>

<div id="ks3Screen" class="menu-screen">
    <h1 class="menu-title" id="topicTitle">KS3 Topic</h1>
    <p class="menu-subtitle">Choose an activity:</p>
    <div id="buttonContainer" class="button-row"></div>
</div>

<!-- USER HEADER -->
<script type="module" src="./headerUser.js"></script>

<!-- MAIN LOGIC -->
<script type="module">
    // Import functions from your modules
    import { getCurrentUser } from "./userManager.js";
    import { goBack } from "./navigation.js";

    // Make goBack() available globally for the Back button
    window.goBack = goBack;

    // -----------------------------
    // TRUE PLAY MODE DETECTION
    // -----------------------------
    // Play Mode = when a student is playing without logging in or joining a session
    const isPlayMode = localStorage.getItem("isPlayMode") === "true";

    // Logged-in user (Google/Microsoft) OR session user
    const user = getCurrentUser();

    // Session user = someone who joined using a session code
    const isSessionUser = !!localStorage.getItem("sessionCode");

    // Leaderboard should show ONLY IF:
    // - NOT in play mode
    // - AND user is logged in OR joined a session
    const showLeaderboard = (!isPlayMode && (user || isSessionUser));

    // -----------------------------
    // URL PARAMS
    // -----------------------------
    // Read ?course=KS3&unit=Programming&topic=Data Types from the URL
    const params = new URLSearchParams(window.location.search);

    let course = params.get("course");
    let unit   = params.get("unit");
    let topic  = params.get("topic");

    // Legacy support: older pages used ?category= instead of ?unit=
    const legacyCategory = params.get("category");

    // If old category system is used, convert it to new format
    if (!course && legacyCategory) course = "KS3";
    if (!unit && legacyCategory) unit = legacyCategory;

    // Decode URL text safely
    course = course ? decodeURIComponent(course) : null;
    unit   = unit   ? decodeURIComponent(unit)   : null;
    topic  = topic  ? decodeURIComponent(topic)  : null;

    // Update page title with the topic name
    const topicTitleEl = document.getElementById("topicTitle");
    const container = document.getElementById("buttonContainer");

    if (!topic) topicTitleEl.innerText = "No topic selected";
    else topicTitleEl.innerText = topic;

    // -----------------------------
    // BUTTON CREATOR
    // -----------------------------
    // Creates a normal clickable button
    function addButton(label, url) {
        const btn = document.createElement("button");
        btn.className = "menu-btn";
        btn.innerText = label;
        btn.onclick = () => window.location.href = url;
        container.appendChild(btn);
    }

        // 🔓 UNLOCKED MATCHING BUTTON
        function addMatchingButton() {
            const btn = document.createElement("button");
            btn.className = "menu-btn";
            btn.innerText = "Matching Game";
            btn.onclick = () => {
                window.location.href =
                    `matching-game.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}&topic=${encodeURIComponent(topic)}`;
            };
            container.appendChild(btn);
        }



    // Lowercase version of topic for easy comparison
    const t = (topic || "").toLowerCase();

    // Topics that ONLY have Binary Quiz (no theory, no exam)
    const binaryTopics = [
        "binary to denary",
        "binary to denary (easy)",
        "denary to binary",
        "denary to binary (easy)",
        "binary addition",
        "binary addition (easy)"
    ];

    // Topics that ONLY have Matching mode (but you locked matching anyway)
    const matchingOnlyTopics = [
        "input/output devices",
        "storage devices"
    ];

    // -----------------------------
    // TOPIC LOGIC
    // -----------------------------
    // CASE 1: Binary topics → Only Binary Quiz + Leaderboard
    if (binaryTopics.includes(t)) {

        addButton(
            "Binary Quiz",
            `binary-quiz.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}&topic=${encodeURIComponent(topic)}`
        );


        if (showLeaderboard) {
            addButton(
                "Leaderboard",
                `leaderboard.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}&topic=${encodeURIComponent(topic)}`
            );
        }
    }

    // CASE 2: Matching-only topics → Only Matching (locked) + Leaderboard
    else if (matchingOnlyTopics.includes(t)) {

        // Matching is locked
        addMatchingButton();

        if (showLeaderboard) {
            addButton(
                "Leaderboard",
                `leaderboard.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}&topic=${encodeURIComponent(topic)}`
            );
        }
    }

    // CASE 3: All other topics → Theory + Exam + Matching (locked) + Leaderboard
    else {

        // Theory Quiz button
        addButton(
            "Theory Quiz",
            `theory-quiz.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}&topic=${encodeURIComponent(topic)}`
        );

        // Matching still locked
        addMatchingButton();

        // Exam Mode button
        addButton(
            "Exam Mode",
            `exam-mode.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}&topic=${encodeURIComponent(topic)}`
        );

        // Leaderboard button (if allowed)
        if (showLeaderboard) {
            addButton(
                "Leaderboard",
                `leaderboard.html?course=${encodeURIComponent(course)}&unit=${encodeURIComponent(unit)}&topic=${encodeURIComponent(topic)}`
            );
        }
    }

    // Language dropdown handler
    function changeLanguage(lang) {
        alert("Language changed to: " + lang);
    }
</script>


</body>
</html>
